<script>window.EMBEDDED_QUESTIONS={"version": "1.0.0", "questions": [{"id": "b01", "level": 1, "type": "analogia", "prompt": "Semilla es a árbol como…", "options": ["hoja es a árbol", "nido es a ave", "raíz es a tierra", "huevo es a ave"], "answer": 3, "explanation": "Una semilla puede desarrollarse hasta formar un árbol; un huevo puede desarrollarse hasta dar lugar a un ave. El nido aloja al ave, pero no se transforma en ella.", "tip": "Convierte cada pareja en una oración y conserva el mismo verbo.", "relation": "Etapa inicial → organismo desarrollado"}, {"id": "b02", "level": 1, "type": "analogia", "prompt": "Página es a libro como…", "options": ["biblioteca es a libro", "pintura es a pincel", "lector es a libro", "ladrillo es a muro"], "answer": 3, "explanation": "Una página es una pieza que integra un libro; un ladrillo es una pieza que integra un muro. La biblioteca contiene libros, pero invierte la dirección: contenedor → elemento.", "tip": "Comprueba también el orden de los términos.", "relation": "Parte constitutiva → conjunto"}, {"id": "b03", "level": 1, "type": "analogia", "prompt": "Tijeras es a cortar como…", "options": ["regla es a dibujante", "papel es a escribir", "regla es a medir", "cuchillo es a cocina"], "answer": 2, "explanation": "Las tijeras sirven para cortar y la regla sirve para medir. El papel recibe la escritura; no es la herramienta que la realiza.", "tip": "Distingue la herramienta del material sobre el que se trabaja.", "relation": "Herramienta → función"}, {"id": "b04", "level": 1, "type": "analogia", "prompt": "Caliente es a frío como…", "options": ["tibio es a templado", "grande es a enorme", "rápido es a velocidad", "lleno es a vacío"], "answer": 3, "explanation": "Caliente y frío expresan estados opuestos; lleno y vacío también. Grande y enorme difieren en grado, pero no son contrarios.", "tip": "Busca oposición, no una simple diferencia de intensidad.", "relation": "Estados opuestos"}, {"id": "b05", "level": 1, "type": "analogia", "prompt": "Abeja es a colmena como…", "options": ["ave es a vuelo", "oveja es a lana", "pez es a aleta", "hormiga es a hormiguero"], "answer": 3, "explanation": "La colmena es el lugar donde vive una comunidad de abejas; el hormiguero cumple esa función para las hormigas. La aleta es una parte del pez, no su hogar.", "tip": "Nombra el vínculo: aquí se trata del animal y su vivienda.", "relation": "Animal → vivienda colectiva"}, {"id": "b06", "level": 1, "type": "analogia", "prompt": "Sed es a beber como…", "options": ["hambre es a comer", "cansancio es a correr", "sueño es a despertar", "frío es a temblar"], "answer": 0, "explanation": "Beber satisface la sed; comer satisface el hambre. Temblar puede ser una reacción al frío, pero no es la acción equivalente de satisfacer una necesidad.", "tip": "No confundas la respuesta que alivia una necesidad con un síntoma.", "relation": "Necesidad → acción que la satisface"}, {"id": "b07", "level": 1, "type": "vocabulario", "prompt": "«Aunque falló varias veces, Irene fue tenaz y siguió intentándolo». Aquí, tenaz significa…", "options": ["perseverante", "indiferente", "apresurada", "afortunada"], "answer": 0, "explanation": "Seguir intentándolo pese a los fallos muestra perseverancia. Ser afortunada describiría la suerte, no la constancia.", "tip": "Usa lo que hace el personaje como pista del significado."}, {"id": "b08", "level": 1, "type": "vocabulario", "prompt": "«La explicación fue clara: todos la comprendieron a la primera». Clara significa…", "options": ["breve", "famosa", "luminosa", "comprensible"], "answer": 3, "explanation": "Que todos comprendieran la explicación indica que era comprensible. Podría haber sido larga: el texto no dice que fuera breve.", "tip": "Elige el sentido que encaja en la oración, no cualquier significado de la palabra."}, {"id": "b09", "level": 1, "type": "cohesion", "prompt": "Elige el conector que expresa consecuencia: «El sendero estaba cerrado. ___, elegimos otra ruta».", "options": ["Por ejemplo", "Por lo tanto", "Sin embargo", "En cambio"], "answer": 1, "explanation": "Elegir otra ruta es la consecuencia del cierre. Sin embargo marcaría un contraste, no esa relación de causa y efecto.", "tip": "Primero identifica la relación entre las dos ideas."}, {"id": "b10", "level": 1, "type": "cohesion", "prompt": "«Lucía guardó las llaves en la mochila. Después, las buscó durante diez minutos». ¿A qué se refiere «las»?", "options": ["A la mochila", "A Lucía", "A las llaves", "A los minutos"], "answer": 2, "explanation": "Las retoma llaves: ambas formas son femeninas y plurales. Mochila es singular y exigiría la.", "tip": "Comprueba el género, el número y el sentido del pronombre."}, {"id": "b11", "level": 1, "type": "inferencia", "prompt": "Todos los libros del estante rojo son de poesía. Este libro está en el estante rojo. ¿Qué se deduce?", "options": ["No hay poesía en otros estantes.", "Este libro es de poesía.", "Todos los libros de poesía están en ese estante.", "Este libro es el único de poesía."], "answer": 1, "explanation": "La regla se aplica a este libro porque está en el estante rojo. No afirma que todos los libros de poesía deban estar allí.", "tip": "Aplica la regla sin invertirla."}, {"id": "b12", "level": 1, "type": "inferencia", "prompt": "La tienda cierra a las 18:00. Ana llegó a las 18:15 y encontró la puerta cerrada. ¿Qué afirma el texto?", "options": ["La tienda cerró antes de lo habitual.", "Nadie había comprado ese día.", "Ana llegó después de la hora de cierre.", "Ana desconocía el horario."], "answer": 2, "explanation": "Las 18:15 son posteriores a las 18:00. Encontrar la puerta cerrada no permite saber si Ana conocía el horario.", "tip": "Distingue un dato comprobable de una explicación imaginada."}, {"id": "b13", "level": 2, "type": "analogia", "prompt": "Prólogo es a novela como…", "options": ["estribillo es a canción", "preludio es a ópera", "capítulo es a novela", "desenlace es a cuento"], "answer": 1, "explanation": "Un prólogo introduce una novela; un preludio introduce una ópera. Un capítulo también es parte de una novela, pero no tiene necesariamente una función introductoria.", "tip": "Una relación específica vale más que una coincidencia general.", "relation": "Sección introductoria → obra"}, {"id": "b14", "level": 2, "type": "analogia", "prompt": "Termómetro es a temperatura como…", "options": ["brújula es a distancia", "balanza es a equilibrio", "reloj es a puntualidad", "barómetro es a presión"], "answer": 3, "explanation": "El termómetro mide la temperatura; el barómetro mide la presión. Un reloj mide el tiempo, pero no la puntualidad de una persona.", "tip": "Comprueba qué magnitud mide realmente cada instrumento.", "relation": "Instrumento → magnitud medida"}, {"id": "b15", "level": 2, "type": "analogia", "prompt": "Boceto es a pintura terminada como…", "options": ["copia es a documento original", "borrador es a ensayo definitivo", "resumen es a libro publicado", "marco es a cuadro expuesto"], "answer": 1, "explanation": "El boceto es una versión preliminar de una pintura y el borrador lo es de un ensayo. Un resumen reduce el contenido de otro texto; no es su versión preparatoria.", "tip": "Distingue una etapa de elaboración de una transformación posterior.", "relation": "Versión preliminar → obra terminada"}, {"id": "b16", "level": 2, "type": "analogia", "prompt": "Atenuar es a intensidad como…", "options": ["mitigar es a gravedad", "acentuar es a diferencia", "analizar es a complejidad", "medir es a longitud"], "answer": 0, "explanation": "Atenuar reduce la intensidad; mitigar reduce la gravedad de algo. Analizar la complejidad permite examinarla, pero no implica reducirla.", "tip": "Mantén tanto la acción como su dirección: aquí se reduce una propiedad.", "relation": "Reducir → propiedad reducida"}, {"id": "b17", "level": 2, "type": "analogia", "prompt": "Cartógrafo es a mapa como…", "options": ["compositor es a partitura", "guía es a itinerario recibido", "intérprete es a partitura", "lector es a novela"], "answer": 0, "explanation": "El cartógrafo elabora mapas; el compositor crea la música que puede quedar escrita en una partitura. El intérprete utiliza esa partitura para ejecutarla, sin ser necesariamente su creador.", "tip": "Pregunta si la persona crea el producto o solamente lo utiliza.", "relation": "Creador → producto de su trabajo"}, {"id": "b18", "level": 2, "type": "analogia", "prompt": "Júbilo es a alegría como…", "options": ["serenidad es a calma", "enojo es a furia", "pánico es a miedo", "tristeza es a felicidad"], "answer": 2, "explanation": "El júbilo es una alegría intensa; el pánico es un miedo intenso. Enojo y furia también cambian de intensidad, pero la pareja va de menor a mayor y revierte el orden original.", "tip": "Si hay grados, conserva la dirección de la escala.", "relation": "Emoción intensa → emoción básica"}, {"id": "b19", "level": 2, "type": "vocabulario", "prompt": "«El informe debía ser sucinto: dos párrafos bastaban para exponer lo esencial». Sucinto significa…", "options": ["ambiguo", "superficial", "incompleto", "conciso"], "answer": 3, "explanation": "Sucinto significa breve y preciso. Un texto conciso puede recoger lo esencial sin ser superficial ni incompleto.", "tip": "No atribuyas un defecto a una palabra que solo describe brevedad."}, {"id": "b20", "level": 2, "type": "vocabulario", "prompt": "«Se mostró reticente a aceptar el cambio: puso reparos y pidió más tiempo». Reticente significa…", "options": ["poco dispuesto", "desinformado", "entusiasmado", "incapaz"], "answer": 0, "explanation": "Los reparos y la demora muestran poca disposición a aceptar. No prueban incapacidad: podría hacerlo y aun así tener reservas.", "tip": "Distingue actitud, capacidad y conocimiento."}, {"id": "b21", "level": 2, "type": "cohesion", "prompt": "Completa con una concesión: «___ el trayecto era más largo, eligieron esa ruta por ser más segura».", "options": ["A medida que", "Puesto que", "Aunque", "Para que"], "answer": 2, "explanation": "Aunque introduce una dificultad que no impide la elección. Puesto que presentaría la mayor longitud como causa, cuando la razón indicada es la seguridad.", "tip": "La concesión admite un obstáculo y mantiene la afirmación principal."}, {"id": "b22", "level": 2, "type": "cohesion", "prompt": "«El equipo redujo el consumo de agua sin disminuir la producción. Ese resultado permitió mantener el mismo volumen con menos recursos». ¿Qué retoma «ese resultado»?", "options": ["El volumen de agua disponible antes del cambio.", "La reducción del consumo sin bajar la producción.", "La contratación de más trabajadores.", "Una disminución de la producción."], "answer": 1, "explanation": "Ese resultado resume el hecho completo anterior: usar menos agua manteniendo la producción. No se refiere únicamente a una palabra ni a un cambio de personal.", "tip": "Un demostrativo puede retomar toda una idea."}, {"id": "b23", "level": 2, "type": "inferencia", "prompt": "Solo se exhiben piezas que han superado la inspección. La pieza X está en exhibición. ¿Qué se deduce?", "options": ["La pieza X fue la mejor evaluada.", "Toda pieza inspeccionada está en exhibición.", "La pieza X superó la inspección.", "No existen piezas aprobadas fuera de exhibición."], "answer": 2, "explanation": "Exhibirse exige haber superado la inspección; por eso X la superó. La regla no obliga a exhibir todas las piezas aprobadas.", "tip": "«Solo» puede introducir una condición necesaria, no una garantía de selección."}, {"id": "b24", "level": 2, "type": "inferencia", "prompt": "Marta puede asistir el martes o el jueves. El jueves tiene un compromiso que le impide asistir. Según estos datos, ¿qué día le queda disponible?", "options": ["El martes.", "Ambos días.", "Ninguno de los dos.", "El jueves."], "answer": 0, "explanation": "El texto ofrece dos días posibles y descarta el jueves. Queda el martes; no hay información que lo descarte.", "tip": "Elimina únicamente las alternativas que los datos excluyen."}, {"id": "b25", "level": 3, "type": "analogia", "prompt": "Refutar es a afirmación como…", "options": ["difundir es a opinión", "rebatir es a argumento", "examinar es a hipótesis", "sustentar es a tesis"], "answer": 1, "explanation": "Refutar una afirmación y rebatir un argumento consisten en impugnar su validez mediante razones. Examinar una hipótesis solo implica estudiarla: el examen podría confirmarla.", "tip": "Distingue el análisis neutral de la acción dirigida a rechazar una idea.", "relation": "Cuestionamiento razonado → idea impugnada"}, {"id": "b26", "level": 3, "type": "analogia", "prompt": "Diluir es a concentración como…", "options": ["intensificar es a brillo", "examinar es a densidad", "calibrar es a precisión", "abreviar es a duración"], "answer": 3, "explanation": "Diluir reduce la concentración; abreviar reduce la duración. Examinar la densidad permite analizarla, pero no implica disminuirla. Calibrar busca ajustar un instrumento, no reducir su precisión.", "tip": "Sustituye el verbo por «reducir» y verifica la propiedad exacta.", "relation": "Acción reductora → propiedad que disminuye"}, {"id": "b27", "level": 3, "type": "analogia", "prompt": "Indicio es a prueba concluyente como…", "options": ["convicción es a duda", "sospecha es a certeza", "hipótesis es a conjetura", "evidencia es a señal"], "answer": 1, "explanation": "Un indicio orienta, pero por sí solo no equivale a una prueba concluyente; una sospecha tampoco equivale a una certeza. Hipótesis y conjetura se mantienen en un grado tentativo similar.", "tip": "Busca el salto desde lo tentativo hacia lo establecido.", "relation": "Apoyo o creencia tentativa → establecimiento concluyente"}, {"id": "b28", "level": 3, "type": "analogia", "prompt": "Cimiento es a edificio como…", "options": ["conclusión es a razonamiento", "título es a capítulo", "premisa es a razonamiento", "ejemplo es a definición"], "answer": 2, "explanation": "El cimiento sirve de base al edificio; una premisa sirve de base al razonamiento. La conclusión es el resultado del razonamiento, no el punto de partida que lo sostiene.", "tip": "Prueba la relación abstracta «sirve de base a».", "relation": "Fundamento → estructura sustentada"}, {"id": "b29", "level": 3, "type": "analogia", "prompt": "Confluencia es a cauces como…", "options": ["fusión es a entidades", "coexistencia es a grupos", "clasificación es a categorías", "bifurcación es a caminos"], "answer": 0, "explanation": "La confluencia reúne cauces; una fusión reúne entidades en una sola. La coexistencia permite que varios grupos estén presentes, pero no exige que se integren.", "tip": "Distingue unirse de estar juntos sin integrarse.", "relation": "Proceso de unión → elementos que se integran"}, {"id": "b30", "level": 3, "type": "analogia", "prompt": "Impermeabilizar es a filtración como…", "options": ["reparar es a avería", "describir es a deterioro", "diagnosticar es a enfermedad", "inmunizar es a infección"], "answer": 3, "explanation": "Impermeabilizar busca evitar una filtración; inmunizar busca evitar una infección. Reparar una avería corrige un daño existente: es una acción correctiva, no preventiva.", "tip": "Distingue prevenir, detectar y remediar un problema.", "relation": "Acción protectora → problema que busca prevenir"}, {"id": "b31", "level": 3, "type": "vocabulario", "prompt": "«El coordinador fue expeditivo: resolvió el trámite con rapidez y sin rodeos». Expeditivo significa…", "options": ["ágil y resolutivo", "autoritario e inflexible", "precipitado e imprudente", "minucioso y lento"], "answer": 0, "explanation": "Expeditivo alude a actuar con eficacia y prontitud. El texto no atribuye imprudencia: resolver rápido no equivale a resolver mal.", "tip": "Evita añadir juicios negativos que el contexto no sostiene."}, {"id": "b32", "level": 3, "type": "vocabulario", "prompt": "«Ante la pregunta sobre el presupuesto, soslayó el asunto y habló de otro tema». Soslayó significa…", "options": ["aclaró", "eludió", "refutó", "pospuso formalmente"], "answer": 1, "explanation": "Cambiar de tema para no tratar el asunto es eludirlo. Refutarlo exigiría argumentos en contra; posponerlo formalmente exigiría anunciar que se tratará después.", "tip": "Busca la acción realmente descrita, sin inventar una intención adicional."}, {"id": "b33", "level": 3, "type": "cohesion", "prompt": "«La propuesta era viable; ___, se descartó, ___ su costo superaba el presupuesto». Elige los conectores que expresan contraste y luego causa.", "options": ["sin embargo / porque", "por lo tanto / aunque", "además / mientras", "es decir / por eso"], "answer": 0, "explanation": "Sin embargo contrasta la viabilidad con el rechazo; porque presenta el costo como causa. Por lo tanto haría del rechazo una consecuencia de la viabilidad, contrario a la relación solicitada.", "tip": "Resuelve cada vínculo por separado y después lee el conjunto."}, {"id": "b34", "level": 3, "type": "cohesion", "prompt": "Ordena: I. Esa comparación reveló menos errores. II. Primero se probó el método nuevo. III. Luego se compararon sus resultados con los del método anterior. IV. Por ese motivo, se decidió adoptarlo.", "options": ["II → I → III → IV", "II → III → IV → I", "II → III → I → IV", "III → II → IV → I"], "answer": 2, "explanation": "Primero se prueba; luego se comparan los resultados. Esa comparación de I retoma III, y ese motivo de IV retoma la reducción de errores de I. Adelantar IV deja sin presentar la razón de la adopción.", "tip": "Sigue los antecedentes de «esa» y «ese», además de los marcadores temporales."}, {"id": "b35", "level": 3, "type": "inferencia", "prompt": "Ningún informe sin fuentes se aprueba. Algunos informes con fuentes se rechazan. ¿Cuál es la conclusión más precisa?", "options": ["Ningún informe puede ser aprobado.", "Tener fuentes garantiza la aprobación.", "Tener fuentes es necesario, pero no garantiza la aprobación.", "Todo informe rechazado carece de fuentes."], "answer": 2, "explanation": "La primera oración exige fuentes para aprobar; la segunda muestra que las fuentes no bastan. No se puede invertir la regla y atribuir toda desaprobación a la falta de fuentes.", "tip": "Separa una condición necesaria de una condición suficiente."}, {"id": "b36", "level": 3, "type": "inferencia", "prompt": "La biblioteca abrió una sala nocturna. Ese mes aumentaron las visitas, pero también hubo exámenes y se amplió la colección. ¿Qué conclusión respeta la evidencia?", "options": ["La nueva colección fue la única causa.", "No se puede atribuir el aumento exclusivamente al horario nocturno.", "Los exámenes no influyeron en las visitas.", "El horario nocturno causó todo el aumento."], "answer": 1, "explanation": "Coinciden varios cambios y no se aísla su efecto. El horario pudo contribuir, pero estos datos no permiten asignarle todo el aumento ni excluir las otras explicaciones.", "tip": "La coincidencia temporal no demuestra una causa exclusiva."}]};</script><script>(function(root,factory){if(typeof module==='object'&&module.exports){module.exports=factory()}else{root.VerbalCore=factory()}})(typeof globalThis!=='undefined'?globalThis:this,function(){

${storageProblem?`<div class="banner warning" role="alert">${escape(storageProblem)}</div>`:''}
${pending?`<div class="banner"><div><strong>Tienes una práctica en curso</strong><div class="small">Nivel ${pending.level} · ${pending.responses.filter(r=>r.chosen!==null).length} de ${pending.questions.length} respondidas</div></div><button class="button primary" data-action="resume">Continuar práctica</button></div>`:''}
<div class="setup"><section class="panel" aria-labelledby="setup-title"><h2 id="setup-title">¿Qué quieres practicar hoy?</h2><div class="level-grid" role="radiogroup" aria-label="Nivel de dificultad">${[1,2,3].map(l=>`<label class="level"><input type="radio" name="level" value="${l}" ${selectedLevel===l?'checked':''}><span class="level-content"><span class="level-number">0${l}</span><span class="level-name">${levels[l]}</span><span class="level-desc">${levelDescriptions[l]}</span></span></label>`).join('')}</div><div class="control-row"><label class="field">Preguntas<select id="question-count"><option value="6" ${selectedCount===6?'selected':''}>6 · práctica breve</option><option value="10" ${selectedCount===10?'selected':''}>10 · práctica completa</option></select></label><button class="button primary" data-action="start">Comenzar práctica</button></div><p class="small" style="margin-top:18px">Sin cuenta, sin cronómetro límite. La retroalimentación aparece al terminar. Puedes pausar y volver después.</p><p class="small" style="margin-top:12px"><strong>¿Vas a perder señal?</strong> Abre esta página con conexión y espera a ver «Lista para usar sin conexión» arriba. Mantén este navegador y esta dirección.</p></section>
<aside class="panel guide"><span class="eyebrow">Una estrategia que funciona</span><h2>Relacionar no es<br>solo asociar.</h2><ol><li><strong>Nombra la relación.</strong><br>¿Causa y efecto, parte y todo, instrumento y función?</li><li><strong>Conserva el sentido.</strong><br>La segunda pareja debe ir en la misma dirección.</li><li><strong>Prueba la frase.</strong><br>¿Puedes explicar ambas parejas con las mismas palabras?</li></ol><div class="guide-example">Brújula : orientación<br>Termómetro : temperatura<br><span class="small">Ambos instrumentos proporcionan información específica. No basta con que los objetos se usen juntos.</span></div></aside></div>
<section aria-labelledby="history-title"><div class="section-head"><h2 id="history-title">Tu recorrido</h2>${state.history.length?'<button class="text-button" data-action="export-all">Descargar todo · JSON</button>':''}</div>${state.history.length?`<div class="history-list">${state.history.slice(0,8).map(a=>{const s=C.score(a);return `<div class="history-row"><span class="history-score">${s.correct}<span class="small">/${s.total}</span></span><div class="history-label"><strong>${a.mode==='retry'?'Repaso de errores':'Nivel '+a.level+' · '+levels[a.level]}</strong><span class="small">${date(a.completedAt)} · ${duration(s.timeMs)}</span></div><div class="history-actions"><span class="small">${s.percent}% de aciertos</span><button class="text-button" data-action="view-result" data-id="${escape(a.id)}">Ver resultados</button></div></div>`}).join('')}</div>${state.history.length>8?`<p class="small history-all">Mostrando las 8 prácticas más recientes de ${state.history.length}. El informe completo incluye todas.</p>`:''}`:'<p class="empty-history">Tu primera práctica es el punto de partida. Los resultados se guardan solo en este navegador.</p>'}</section>
`;}
function renderPractice(){const s=state.current;if(!s){view='home';renderHome();return}const q=s.questions[s.index],r=s.responses[s.index],answered=s.responses.filter(x=>x.chosen!==null).length;$('#main').innerHTML=`<div class="question-wrap"><div class="practice-top"><span class="small">${s.mode==='retry'?'Repaso de errores':'Nivel '+s.level+' · '+levels[s.level]}</span><button class="text-button" data-action="pause">Pausar y guardar</button></div><div class="progress" role="progressbar" aria-label="Preguntas respondidas" aria-valuenow="${answered}" aria-valuemin="0" aria-valuemax="${s.questions.length}"><span style="width:${answered/s.questions.length*100}%"></span></div><section class="panel"><div class="question-meta"><span class="question-number">Pregunta ${s.index+1} de ${s.questions.length}</span><span>${escape(names[q.type]||q.type)}</span></div><h1 id="view-title" class="question-title">${escape(q.prompt)}</h1><fieldset class="options"><legend class="sr-only">Elige una respuesta</legend>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${r.chosen===i?'checked':''}><span class="option-letter" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${escape(o)}</span></label>`).join('')}</fieldset><fieldset class="confidence"><legend>¿Cuánta seguridad tienes? <span class="small">Opcional</span></legend><div class="confidence-options">${Object.entries(confidenceNames).map(([k,v])=>`<label class="confidence-label"><input type="radio" name="confidence" value="${k}" ${r.confidence===k?'checked':''}><span>${v}</span></label>`).join('')}</div></fieldset></section><div class="practice-bottom"><button class="button secondary" data-action="previous" ${s.index===0?'disabled':''}>Anterior</button>${s.index===s.questions.length-1?`<button class="button primary" data-action="finish">Terminar práctica</button>`:'<button class="button primary" data-action="next">Siguiente</button>'}</div><nav class="question-nav" aria-label="Navegar por las preguntas">${s.questions.map((q,i)=>`<button class="q-dot ${s.responses[i].chosen!==null?'answered':''} ${i===s.index?'active':''}" data-action="goto" data-index="${i}" aria-label="Pregunta ${i+1}, ${s.responses[i].chosen!==null?'respondida':'sin responder'}" ${i===s.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</nav><p class="helper">Puedes cambiar tus respuestas antes de terminar. No hay límite de tiempo.</p>${storageProblem?`<p class="storage-warning" role="alert">${escape(storageProblem)}</p>`:''}</div>`;lastTick=document.hidden?0:performance.now()}
function updateProgress(){const s=state.current;if(!s)return;const n=s.responses.filter(r=>r.chosen!==null).length;const p=$('.progress');p?.setAttribute('aria-valuenow',String(n));if(p)p.firstElementChild.style.width=n/s.questions.length*100+'%';document.querySelectorAll('.q-dot').forEach((b,i)=>{b.classList.toggle('answered',s.responses[i].chosen!==null);b.setAttribute('aria-label',`Pregunta ${i+1}, ${s.responses[i].chosen!==null?'respondida':'sin responder'}`)})}
function recommendation(a){const s=C.score(a),bad=a.questions.filter((q,i)=>a.responses[i].chosen!==q.answer),highMistakes=a.questions.filter((q,i)=>a.responses[i].chosen!==q.answer&&a.responses[i].confidence==='high').length;if(!bad.length)return {title:'Precisión de principio a fin',text:a.level<3?'Resolviste todas las preguntas. Puedes pasar al siguiente nivel o probar otra selección para comprobar si mantienes la precisión.':'Resolviste todas las preguntas de esta selección. Vuelve a practicar y explica en voz alta por qué cada alternativa incorrecta no encaja.'};const weaknesses=Object.entries(s.categories).filter(([k,v])=>v.correct<v.total).sort((a,b)=>(a[1].correct/a[1].total)-(b[1].correct/b[1].total));const type=weaknesses[0][0];const tips={analogia:'Antes de mirar las opciones, escribe una frase que describa la relación exacta de la primera pareja. Aplícala sin cambiar el sentido a cada alternativa.',vocabulario:'Sustituye la palabra por cada alternativa dentro de la oración. Comprueba el sentido completo y el tono, no solo si parece un sinónimo.',cohesion:'Identifica primero la relación entre las ideas: contraste, causa, consecuencia o secuencia. Después elige el conector u orden que la conserva.',inferencia:'Separa lo que el texto afirma de lo que solo resulta posible. Una conclusión válida debe apoyarse en las pistas sin añadir supuestos.'};return {title:'Tu siguiente foco: '+(names[type]||type).toLowerCase(),text:(tips[type]||'Revisa las explicaciones y contrasta cada opción con la pregunta.')+(highMistakes?' En '+highMistakes+' respuesta'+(highMistakes===1?' incorrecta marcaste mucha seguridad. Revisa qué pista te llevó a elegirla.':'s incorrectas marcaste mucha seguridad. Revisa qué pistas te llevaron a elegirlas.'):'')}}
function renderResult(){const a=state.history.find(x=>x.id===resultId);if(!a){view='home';renderHome();return}const s=C.score(a),rec=recommendation(a),wrong=s.total-s.correct;$('#main').innerHTML=`<section class="result-hero"><div><span class="eyebrow">Práctica terminada</span><h1 id="view-title">${s.percent>=80?'La precisión se entrena.':'Cada error deja una pista.'}</h1><p>${s.correct} de ${s.total} respuestas correctas · ${duration(s.timeMs)} de tiempo activo<br>${a.mode==='retry'?'Repaso de errores':'Nivel '+a.level+' · '+levels[a.level]}</p></div><div class="score-ring" style="--score:${s.percent}%"><div class="score-value"><strong>${s.percent}%</strong><span>de aciertos</span></div></div></section><div class="metric-grid">${Object.entries(s.categories).map(([k,v])=>`<div class="metric"><span class="small">${names[k]||escape(k)}</span><strong>${v.correct}<span class="small" style="display:inline"> / ${v.total}</span></strong></div>`).join('')}</div><section class="panel recommendation"><span class="eyebrow">Lo que puedes mejorar ahora</span><h2>${escape(rec.title)}</h2><p>${escape(rec.text)}</p></section><div class="actions">${wrong?'<button class="button primary" data-action="retry">Volver a intentar los errores</button>':a.level<3?'<button class="button primary" data-action="next-level">Probar el siguiente nivel</button>':''}<button class="button secondary" data-action="home">Elegir otra práctica</button></div><section class="export-panel"><h2>Tu informe, listo para compartir</h2><p>Descarga el JSON y adjúntalo en tu conversación con el asistente para analizar tus patrones. Incluye preguntas, respuestas, explicaciones, seguridad y tiempos. No se envía automáticamente.</p><div class="actions"><button class="button primary" data-action="export-json">Descargar informe · JSON</button><button class="button secondary" data-action="export-txt">Versión de lectura · TXT</button><button class="button secondary" data-action="print">Imprimir / guardar PDF</button></div></section><div class="section-head"><h2>Revisa el razonamiento</h2><button class="text-button" data-action="expand">Abrir explicaciones</button></div><div class="review-list">${a.questions.map((q,i)=>{const r=a.responses[i],right=r.chosen===q.answer;return `<details class="review-item" ${!right?'open':''}><summary><span class="review-state ${right?'correct':'incorrect'}">${right?'✓ Correcta':'× A revisar'}</span><span class="review-prompt">${i+1}. ${escape(q.prompt)}</span></summary><div class="review-body">${q.options.map((o,j)=>`<div class="review-option ${j===q.answer?'correct':j===r.chosen?'incorrect':''}">${String.fromCharCode(65+j)}. ${escape(o)}${j===q.answer?' · Respuesta correcta':''}${j===r.chosen?' · Tu elección':''}</div>`).join('')}<p><strong>Por qué:</strong> ${escape(q.explanation)}</p><p class="tip"><strong>Para la próxima:</strong> ${escape(q.tip)}</p><p class="small">${names[q.type]||escape(q.type)} · ${duration(r.timeMs)} · Seguridad: ${confidenceNames[r.confidence]||'sin indicar'}</p></div></details>`}).join('')}</div><p class="helper">Práctica educativa original. Los porcentajes describen esta selección; no son una prueba estandarizada ni un diagnóstico.</p>${storageProblem?`<p class="storage-warning" role="alert">${escape(storageProblem)}</p>`:''}`;}
function startSession(mode='practice',questions=null){tick();if(state.current){showDialog('<h2>Ya tienes una práctica en curso</h2><p>Continúala para conservar tus respuestas. También puedes descartarla y empezar de nuevo.</p><button class="button secondary" data-action="discard">Descartar práctica en curso</button>');return}state.current=C.createSession(questions||bank.questions,bank.version,selectedLevel,questions?questions.length:selectedCount,mode);save();view='practice';render()}
function download(content,type,extension,label='practica'){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=`entrena-verbal-${label}-${new Date().toISOString().slice(0,10)}.${extension}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notify('Informe preparado. Si el navegador lo abre, usa Compartir o Guardar en Archivos.')}
function exportJSON(attempts,label){download(JSON.stringify(C.report(attempts,bank.version),null,2),'application/json','json',label)}
function exportText(a){const r=C.report([a],bank.version),s=r.attempts[0];const lines=['ENTRENA VERBAL — INFORME DE PRÁCTICA','Fecha: '+date(a.completedAt),'Nivel: '+a.level+' · '+levels[a.level],'Modo: '+a.mode,`Resultado: ${s.summary.correct}/${s.summary.total} (${s.summary.percent}%)`,'Tiempo activo: '+duration(s.summary.timeMs),'Banco: '+a.bankVersion,'','Uso educativo; no es un diagnóstico.',''];s.questions.forEach((q,i)=>{lines.push(`${i+1}. ${q.prompt}`,...q.options.map((o,j)=>`${String.fromCharCode(65+j)}. ${o}`),`Tu respuesta: ${q.chosenAnswer}`,`Correcta: ${q.correctAnswer}`,`Resultado: ${q.isCorrect?'correcta':'incorrecta'}`,`Explicación: ${q.rationale}`,`Consejo: ${q.tip}`,`Tipo: ${names[q.type]||q.type} · Tiempo: ${duration(q.timeMs)} · Seguridad: ${confidenceNames[q.confidence]||'sin indicar'}`,'')});download(lines.join('\n'),'text/plain;charset=utf-8','txt')}
function showDialog(html){$('#dialog-content').innerHTML=html;$('#info-dialog').showModal()}
function privacy(){showDialog('<h2>Tu práctica se queda contigo</h2><p>Las respuestas y el historial se guardan únicamente en este navegador. No hay cuentas, analítica, publicidad ni envío automático de resultados. El proveedor de alojamiento puede registrar las visitas normales a la página.</p><p>Para pedir ayuda, descarga un informe y compártelo tú. Borrar los datos del navegador o usar navegación privada puede eliminar el progreso.</p><p><strong>Sin conexión:</strong> abre la web con internet y espera al aviso «Lista para usar sin conexión». Después puedes practicar, recargar y descargar informes sin señal. El navegador puede liberar el almacenamiento; si eso ocurre, vuelve a abrir la web con conexión.</p><p>El tiempo registrado es aproximado y cuenta cuando la página está visible. Los niveles son educativos, no un baremo oficial.</p>')}
document.addEventListener('change',event=>{const t=event.target;if(t.name==='level')selectedLevel=Number(t.value);if(t.id==='question-count')selectedCount=Number(t.value);if(t.name==='answer'&&state.current){tick();C.answer(state.current,state.current.index,Number(t.value));save();updateProgress()}if(t.name==='confidence'&&state.current){tick();state.current.responses[state.current.index].confidence=t.value;save()}});
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;event.preventDefault();const action=b.dataset.action;try{if(action==='close-dialog'){$('#info-dialog').close();return}if(action==='privacy'){privacy();return}if(!bank)return;if(action==='start'){startSession();return}if(action==='discard'){state.current=null;save();$('#info-dialog').close();view='home';render();notify('Práctica descartada. Ya puedes elegir una nueva.');return}if(action==='resume'){view='practice';render();return}if(action==='home'||action==='pause'){tick();save();view='home';render();return}if(action==='view-result'){tick();resultId=b.dataset.id;view='result';render();return}if(action==='next'||action==='previous'||action==='goto'){if(!state.current)return;tick();const delta=action==='next'?1:-1;state.current.index=action==='goto'?Number(b.dataset.index):state.current.index+delta;state.current.index=Math.max(0,Math.min(state.current.questions.length-1,state.current.index));save();render();return}if(action==='finish'){if(!state.current)return;tick();if(!C.isComplete(state.current)){state.current.index=state.current.responses.findIndex(r=>r.chosen===null);save();render();notify('Falta responder esta pregunta. Puedes revisar las demás antes de terminar.');return}const result=C.finish(state);resultId=result.id;save();view='result';lastTick=0;render();return}if(action==='export-all'){exportJSON(state.history,'historial');return}const a=state.history.find(x=>x.id===resultId);if(!a)return;if(action==='export-json')exportJSON([a],'practica');if(action==='export-txt')exportText(a);if(action==='print'){document.querySelectorAll('.review-item').forEach(d=>d.open=true);window.print()}if(action==='expand'){const all=[...document.querySelectorAll('.review-item')],open=all.some(d=>!d.open);all.forEach(d=>d.open=open);b.textContent=open?'Cerrar explicaciones':'Abrir explicaciones'}if(action==='retry'){const wrong=a.questions.filter((q,i)=>a.responses[i].chosen!==q.answer);selectedLevel=a.level;startSession('retry',wrong)}if(action==='next-level'){selectedLevel=Math.min(3,a.level+1);view='home';render()}}catch(error){notify(error.message||'No pudimos completar la acción. Inténtalo de nuevo.')}});
// Flush active time before hiding. Closed or background time is never added on resume.
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(view==='practice'&&state.current&&lastTick){state.current.responses[state.current.index].timeMs+=Math.max(0,Math.round(performance.now()-lastTick))}lastTick=0;save()}else{lastTick=view==='practice'?performance.now():0}});
window.addEventListener('pagehide',()=>{tick();save()});
setInterval(()=>{if(view==='practice'&&!document.hidden){tick();save()}},15000);
async function offlineSetup(){const badge=$('#offline-status');if(location.protocol==='file:'){badge.textContent='Archivo local · disponible sin conexión';return}if(!('serviceWorker'in navigator)){badge.textContent='Modo sin conexión no disponible';return}const check=async()=>{try{const registration=await navigator.serviceWorker.ready;const cache=await caches.open('entrena-verbal-v1');const paths=['./index.html','./styles.css','./core.js','./app.js','./questions.json','./manifest.webmanifest','./icon.svg','./icon-192.png','./icon-512.png'];const stored=await Promise.all(paths.map(p=>cache.match(new URL(p,document.baseURI).href)));if(stored.every(Boolean)&&registration.active){badge.textContent=navigator.onLine?'Lista para usar sin conexión':'Sin conexión · lista para practicar';badge.classList.add('ready')}else{badge.textContent=navigator.onLine?'Preparando modo sin conexión…':'Sin conexión · caché incompleta'}}catch(e){badge.textContent='No se pudo preparar el modo sin conexión'}};try{await navigator.serviceWorker.register('./sw.js',{scope:'./'});await check();navigator.serviceWorker.addEventListener('controllerchange',check);window.addEventListener('online',check);window.addEventListener('offline',check)}catch(e){badge.textContent='Modo sin conexión no disponible'}}
async function init(){try{try{state=C.restore(localStorage.getItem(KEY))}catch(e){storageProblem='No pudimos recuperar el guardado anterior. Puedes practicar, pero descarga los próximos resultados antes de cerrar.';storageOK=false}const response=window.EMBEDDED_QUESTIONS?null:await fetch('./questions.json');if(response&&!response.ok)throw Error('No se pudo cargar el banco de preguntas.');bank=window.EMBEDDED_QUESTIONS||await response.json();if(!bank||!Array.isArray(bank.questions)||!bank.questions.length)throw Error('El banco de preguntas no está disponible.');render(false);offlineSetup()}catch(e){$('#main').innerHTML='<div class="loading"><span class="eyebrow">No se pudo cargar la práctica</span><h1>Necesitas una primera visita con conexión.</h1><p>Vuelve a abrir esta página con internet y espera a que aparezca el aviso de modo sin conexión.</p><button class="button primary" onclick="location.reload()" style="margin-top:24px">Volver a intentar</button></div>';$('#offline-status').textContent='Práctica sin descargar'}}
init();
})();
</script></body></html>
